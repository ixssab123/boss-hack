name: Build BOSS HACK IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Check files
        run: |
          ls -la
          find . -maxdepth 3 -type f

      - name: Build app
        run: |
          xcodebuild -project "BOSS HACK.xcodeproj" \
            -scheme "BOSS HACK" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/*.app Payload/
          zip -r BOSS-HACK.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: BOSS-HACK-IPA
          path: BOSS-HACK.ipa
